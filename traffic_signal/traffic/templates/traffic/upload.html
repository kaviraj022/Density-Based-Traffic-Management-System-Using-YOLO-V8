{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Upload Lane Videos/Images</title>
    <link rel="stylesheet" href="{% static 'traffic/upload.css' %}">
</head>
<body>
    <div class="upload-container">
        <h1>Upload Videos or Images for Each Lane</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label>North Lane: <input type="file" name="north" required></label>
            <label>South Lane: <input type="file" name="south" required></label>
            <label>East Lane: <input type="file" name="east" required></label>
            <label>West Lane: <input type="file" name="west" required></label>
            <button type="submit">Upload</button>
        </form>
    </div>
</body>
</html>
