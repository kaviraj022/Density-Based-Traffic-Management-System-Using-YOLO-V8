<!DOCTYPE html>
<html>
<head>
    <title>Upload Lane Videos/Images</title>
</head>
<body>
    <h1>Upload Videos or Images for Each Lane</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>North Lane: <input type="file" name="north" required></label><br><br>
        <label>South Lane: <input type="file" name="south" required></label><br><br>
        <label>East Lane: <input type="file" name="east" required></label><br><br>
        <label>West Lane: <input type="file" name="west" required></label><br><br>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
